name: Validate and package

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Add coverage summary
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs')
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total
          const metrics = ['lines', 'statements', 'functions', 'branches']
          const percent = (metric) => `${summary[metric].pct}% (${summary[metric].covered}/${summary[metric].total})`

          console.log('## Coverage')
          console.log('| Lines | Statements | Functions | Branches |')
          console.log('| ---: | ---: | ---: | ---: |')
          console.log(`| ${metrics.map(percent).join(' | ')} |`)
          NODE

  package-linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        channel: [dev, prod]
    runs-on: ubuntu-latest
    env:
      WHISPER_SIDECAR_PLATFORM: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pinned Whisper sidecar
        run: |
          git clone --depth 1 --branch v1.8.3 https://github.com/ggml-org/whisper.cpp.git third_party/whisper.cpp
          test "$(git -C third_party/whisper.cpp rev-parse HEAD)" = "2eeeba56e9edd762b4b38467bab96c2517163158"
          # GitHub runners are newer than many target machines. Do not emit a
          # runner-specific -march=native sidecar: it can die with SIGILL while
          # loading a model on an otherwise supported CPU.
          cmake -S third_party/whisper.cpp -B third_party/whisper.cpp/build \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF -DGGML_SSE42=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF \
            -DGGML_BMI2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF
          cmake --build third_party/whisper.cpp/build --target whisper-cli --parallel 2
          mkdir -p resources/whisper.cpp/linux
          cp third_party/whisper.cpp/build/bin/whisper-cli resources/whisper.cpp/linux/whisper-cli
          # Copy the complete whisper.cpp runtime dependency closure. whisper-cli
          # directly needs libwhisper/libggml, while libwhisper also needs the
          # ggml base and CPU libraries. Copying only libwhisper makes the
          # package start failing at the next missing SONAME.
          copy_whisper_dependency() {
            local target="$1"
            local library
            while IFS= read -r library; do
              case "$library" in
                libwhisper.so.*|libggml*.so.*)
                  local destination="resources/whisper.cpp/linux/$library"
                  if [ ! -e "$destination" ]; then
                    local source
                    # A SONAME is commonly a symlink in the build tree; let
                    # find return either that symlink or its concrete target.
                    source="$(find third_party/whisper.cpp/build -name "$library" -print -quit)"
                    test -n "$source"
                    cp -L "$source" "$destination"
                    copy_whisper_dependency "$destination"
                  fi
                  ;;
              esac
            done < <(readelf -d "$target" | sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p')
          }
          copy_whisper_dependency resources/whisper.cpp/linux/whisper-cli
          chmod +x resources/whisper.cpp/linux/whisper-cli
          {
            printf '{\n'
            first=true
            for file in resources/whisper.cpp/linux/*; do
              $first || printf ',\n'
              first=false
              printf '  "linux/%s": "%s"' "$(basename "$file")" "$(sha256sum "$file" | awk '{print $1}')"
            done
            printf '\n}\n'
          } > resources/whisper.cpp/checksums.json
      - name: Set development package version
        if: matrix.channel == 'dev'
        run: npm version "$(node -p "require('./package.json').version")-nightly.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm run package:linux
      - run: |
          test -f release/*.AppImage
          test -f release/*.deb
          test -f release/*.rpm
          expected="research-notebook-production"
          case "$(node -p "require('./package.json').version")" in
            *-nightly.*) expected="research-notebook" ;;
          esac
          test "$(dpkg-deb -f release/*.deb Package)" = "$expected"
          test "$(rpm -qp --queryformat '%{NAME}' release/*.rpm)" = "$expected"
      - name: Smoke test the Whisper sidecar in the Debian package
        run: |
          package="$(find release -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          dpkg-deb -x "$package" "$staging"
          sidecar="$(find "$staging" -path '*/resources/whisper.cpp/linux/whisper-cli' -print -quit)"
          test -n "$sidecar"
          LD_LIBRARY_PATH="$(dirname "$sidecar")" "$sidecar" --help
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.channel }}-appimage
          path: release/*.AppImage
          if-no-files-found: error
      - name: Upload Linux Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.channel }}-deb
          path: release/*.deb
          if-no-files-found: error
      - name: Upload Linux RPM package
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.channel }}-rpm
          path: release/*.rpm
          if-no-files-found: error

  package-windows:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        channel: [dev, prod]
    runs-on: windows-latest
    env:
      WHISPER_SIDECAR_PLATFORM: win32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pinned Whisper sidecar
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.8.3 https://github.com/ggml-org/whisper.cpp.git third_party/whisper.cpp
          if ((git -C third_party/whisper.cpp rev-parse HEAD) -ne '2eeeba56e9edd762b4b38467bab96c2517163158') { throw 'Unexpected whisper.cpp source revision.' }
          # Keep the release sidecar compatible with x64 CPUs that do not
          # support the instruction set available on the Windows CI runner.
          cmake -S third_party/whisper.cpp -B third_party/whisper.cpp/build `
            -DWHISPER_BUILD_EXAMPLES=ON `
            -DGGML_NATIVE=OFF -DGGML_SSE42=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF `
            -DGGML_BMI2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF
          cmake --build third_party/whisper.cpp/build --config Release --target whisper-cli --parallel 2
          New-Item -ItemType Directory -Force -Path resources/whisper.cpp/win32 | Out-Null
          $binary = Get-ChildItem third_party/whisper.cpp/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $binary) { throw 'whisper-cli.exe was not built.' }
          Copy-Item $binary.FullName resources/whisper.cpp/win32/whisper-cli.exe
          # Include the whisper.cpp DLLs built alongside the CLI. The executable
          # alone cannot load on a clean Windows machine when shared libraries
          # are enabled by CMake.
          Get-ChildItem third_party/whisper.cpp/build -Recurse -File |
            Where-Object { $_.Name -match '^(whisper|ggml).*\.dll$' } |
            ForEach-Object {
              $destination = Join-Path 'resources/whisper.cpp/win32' $_.Name
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
            }
          $hashes = [ordered]@{}
          Get-ChildItem resources/whisper.cpp/win32 -File | ForEach-Object {
            $hashes["win32/$($_.Name)"] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
          }
          $hashes | ConvertTo-Json | Set-Content resources/whisper.cpp/checksums.json
      - name: Set development package version
        if: matrix.channel == 'dev'
        shell: bash
        run: npm version "$(node -p "require('./package.json').version")-nightly.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm run package:win
      - shell: pwsh
        run: |
          if (-not (Get-ChildItem release -Filter *.exe)) { throw 'Windows packages were not created.' }
          $packages = Get-ChildItem release -Filter *.exe
          if ($packages.Count -lt 2) { throw 'Expected NSIS and portable executables.' }
          $expected = 'Research Notebook Production'
          if ((node -p "require('./package.json').version") -like '*-nightly.*') { $expected = 'Research Notebook Nightly' }
          foreach ($package in $packages) {
            if ($package.VersionInfo.ProductName -ne $expected) { throw "Unexpected package metadata in $($package.Name)." }
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.channel }}-installer
          path: release/*-Setup-*.exe
          if-no-files-found: error
      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.channel }}-portable
          path: release/*-Portable-*.exe
          if-no-files-found: error
