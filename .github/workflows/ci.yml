name: Validate and package

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Add coverage summary
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs')
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total
          const metrics = ['lines', 'statements', 'functions', 'branches']
          const percent = (metric) => `${summary[metric].pct}% (${summary[metric].covered}/${summary[metric].total})`

          console.log('## Coverage')
          console.log('| Lines | Statements | Functions | Branches |')
          console.log('| ---: | ---: | ---: | ---: |')
          console.log(`| ${metrics.map(percent).join(' | ')} |`)
          NODE

  package-linux:
    needs: validate
    runs-on: ubuntu-latest
    env:
      WHISPER_SIDECAR_PLATFORM: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pinned Whisper sidecar
        run: |
          git clone --depth 1 --branch v1.8.3 https://github.com/ggml-org/whisper.cpp.git third_party/whisper.cpp
          test "$(git -C third_party/whisper.cpp rev-parse HEAD)" = "2eeeba56e9edd762b4b38467bab96c2517163158"
          cmake -S third_party/whisper.cpp -B third_party/whisper.cpp/build -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build third_party/whisper.cpp/build --target whisper-cli --parallel 2
          mkdir -p resources/whisper.cpp/linux
          cp third_party/whisper.cpp/build/bin/whisper-cli resources/whisper.cpp/linux/whisper-cli
          printf '{\n  "linux/whisper-cli": "%s"\n}\n' "$(sha256sum resources/whisper.cpp/linux/whisper-cli | awk '{print $1}')" > resources/whisper.cpp/checksums.json
      - name: Set rolling nightly package version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm version "$(node -p "require('./package.json').version")-nightly.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm run package:linux
      - run: |
          test -f release/*.AppImage
          test -f release/*.deb
          test -f release/*.rpm
          test "$(dpkg-deb -f release/*.deb Package)" = "research-notebook"
          rpm -qip release/*.rpm | grep -q '^Name *: research-notebook$'
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: research-notebook-linux-appimage
          path: release/*.AppImage
          if-no-files-found: error
      - name: Upload Linux Debian package
        uses: actions/upload-artifact@v4
        with:
          name: research-notebook-linux-deb
          path: release/*.deb
          if-no-files-found: error
      - name: Upload Linux RPM package
        uses: actions/upload-artifact@v4
        with:
          name: research-notebook-linux-rpm
          path: release/*.rpm
          if-no-files-found: error

  package-windows:
    needs: validate
    runs-on: windows-latest
    env:
      WHISPER_SIDECAR_PLATFORM: win32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pinned Whisper sidecar
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.8.3 https://github.com/ggml-org/whisper.cpp.git third_party/whisper.cpp
          if ((git -C third_party/whisper.cpp rev-parse HEAD) -ne '2eeeba56e9edd762b4b38467bab96c2517163158') { throw 'Unexpected whisper.cpp source revision.' }
          cmake -S third_party/whisper.cpp -B third_party/whisper.cpp/build -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build third_party/whisper.cpp/build --config Release --target whisper-cli --parallel 2
          New-Item -ItemType Directory -Force -Path resources/whisper.cpp/win32 | Out-Null
          $binary = Get-ChildItem third_party/whisper.cpp/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $binary) { throw 'whisper-cli.exe was not built.' }
          Copy-Item $binary.FullName resources/whisper.cpp/win32/whisper-cli.exe
          @{ 'win32/whisper-cli.exe' = (Get-FileHash resources/whisper.cpp/win32/whisper-cli.exe -Algorithm SHA256).Hash.ToLower() } | ConvertTo-Json | Set-Content resources/whisper.cpp/checksums.json
      - name: Set rolling nightly package version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: npm version "$(node -p "require('./package.json').version")-nightly.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm run package:win
      - shell: pwsh
        run: |
          if (-not (Get-ChildItem release -Filter *.exe)) { throw 'Windows packages were not created.' }
          $packages = Get-ChildItem release -Filter *.exe
          if ($packages.Count -lt 2) { throw 'Expected NSIS and portable executables.' }
          foreach ($package in $packages) {
            if ($package.VersionInfo.ProductName -ne 'Research Notebook') { throw "Unexpected package metadata in $($package.Name)." }
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: research-notebook-windows-installer
          path: release/*-Setup-*.exe
          if-no-files-found: error
      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: research-notebook-windows-portable
          path: release/*-Portable-*.exe
          if-no-files-found: error
